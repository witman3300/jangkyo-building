<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>결산보고서 | 장교빌딩</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--brand:#12395f;--brand2:#1d5183;--accent:#0a84c4;--point:#c9a227;--ink:#1a222c;--gray:#68737f;--line:#e3e7ec;--bg:#f5f7f9}
body{font-family:'Malgun Gothic','맑은 고딕',-apple-system,'Apple SD Gothic Neo',sans-serif;color:var(--ink);line-height:1.6;background:#fff}
a{text-decoration:none;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.top{background:var(--brand);color:#b7c9db;font-size:13px}
.top .wrap{display:flex;justify-content:space-between;align-items:center;height:36px}
.top a:hover{color:#fff}
header{border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:68px}
.logo{font-size:21px;font-weight:800;color:var(--brand);letter-spacing:-1px}
.logo small{display:block;font-size:9.5px;letter-spacing:1.6px;color:var(--point);font-weight:700}
nav ul{display:flex;list-style:none;gap:26px;font-weight:700;font-size:15px}
nav a:hover{color:var(--accent)}
.hero{background:linear-gradient(rgba(9,28,48,.86),rgba(9,28,48,.9)),repeating-linear-gradient(180deg,#17415f 0 26px,#123449 26px 52px);color:#fff;padding:44px 0}
.hero .wrap{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-1px}
.hero .bc{font-size:13.5px;color:#c5d3e1;margin-top:6px}
.board{padding:36px 0 70px}
.view-head{border-bottom:2px solid var(--brand);padding-bottom:16px;margin-bottom:24px}
.view-head h2{font-size:21px;color:var(--ink);font-weight:800;letter-spacing:-.3px;margin-bottom:10px}
.view-meta{display:flex;gap:16px;font-size:13px;color:var(--gray)}
.view-body{font-size:15px;color:#3a424c;line-height:1.9;white-space:pre-line;margin-bottom:28px}
.view-images{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
.view-images img{width:100%;max-width:820px;border:1px solid var(--line);border-radius:6px;display:block}
.view-empty{color:var(--gray);font-size:14px;padding:30px 0}
.btn-row{display:flex;gap:8px;padding-top:18px;border-top:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;padding:9px 18px;border-radius:6px;font-size:13.5px;font-weight:700;border:1px solid var(--line);color:var(--gray)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
footer{background:#0d2136;color:#8ba0b5;font-size:13px;padding:30px 0;text-align:center;line-height:1.9}
@media(max-width:820px){nav{display:none}.hero h1{font-size:24px}}
</style>
</head>
<body>

<div class="top"><div class="wrap">
  <span>장교공영주식회사 · 장교빌딩 관리단</span>
  <span><a href="index.html">홈으로</a></span>
</div></div>

<header><div class="wrap">
  <a href="index.html" class="logo">장교빌딩<small>JANGKYO BUILDING</small></a>
  <nav><ul>
    <li><a href="index.html">홈</a></li>
    <li><a href="about.html">빌딩소개</a></li>
    <li><a href="rental-info.html">임대안내</a></li>
    <li><a href="info-notice.html">정보마당</a></li>
    <li><a href="board.html">회원게시판</a></li>
  </ul></nav>
</div></header>

<section class="hero"><div class="wrap">
  <div>
    <h1>결산보고서</h1>
    <div class="bc">회원광장 &gt; 결산보고서</div>
  </div>
</div></section>

<section class="board"><div class="wrap">
  <div id="app"></div>
</div></section>

<footer><div class="wrap">
  장교빌딩 · JANGKYO BUILDING<br>
  (우) 04541 서울특별시 중구 삼일대로 363, 1505호 (장교동, 장교빌딩)<br>
  TEL 02-778-4611~3 · FAX 02-775-9663 · MAIL jangkyo1505@naver.com<br>
  COPYRIGHT © JANGKYO BLDG. ALL RIGHT RESERVED.
</div></footer>

<script src="auth.js"></script>
<script src="reports-data.js"></script>
<script>
(function () {
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var app = document.getElementById("app");

  if (typeof isSpecial === "function" && !isSpecial()) {
    guardSpecial("app");
    return;
  }

  var id = Number(new URLSearchParams(location.search).get("id"));
  var post = REPORTS.find(function (p) { return p.id === id; });
  if (!post) {
    app.innerHTML = '<div class="view-empty">게시글을 찾을 수 없습니다. <a href="board.html?cat=report" style="color:var(--accent);font-weight:700">목록으로</a></div>';
    return;
  }
  document.title = post.title + " | 장교빌딩";
  var idx = REPORTS.findIndex(function (p) { return p.id === id; });
  var prev = REPORTS[idx - 1];
  var next = REPORTS[idx + 1];

  var imagesHtml = "";
  if (post.imgCount > 0) {
    var imgs = [];
    for (var i = 1; i <= post.imgCount; i++) {
      var seq = (i < 10 ? "0" + i : "" + i);
      imgs.push('<img src="files/report/' + post.id + '/' + seq + '.jpg" alt="' + esc(post.title) + ' 첨부 ' + i + '" loading="lazy" />');
    }
    imagesHtml = '<div class="view-images">' + imgs.join("") + '</div>';
  }

  var bodyHtml = post.text ? '<div class="view-body">' + esc(post.text) + '</div>' : "";
  if (!post.text && !post.imgCount) {
    bodyHtml = '<div class="view-empty">등록된 내용이 없습니다.</div>';
  }

  app.innerHTML = ''
    + '<div class="view-head">'
    + '  <h2>' + esc(post.title) + '</h2>'
    + '  <div class="view-meta"><span>번호 ' + post.no + '</span><span>작성자 관리자</span><span>' + post.date + '</span></div>'
    + '</div>'
    + bodyHtml
    + imagesHtml
    + '<div class="btn-row">'
    + '  <a href="board.html?cat=report" class="btn">목록</a>'
    + (prev ? '  <a href="report-view.html?id=' + prev.id + '" class="btn">다음글: ' + esc(prev.title) + '</a>' : '')
    + (next ? '  <a href="report-view.html?id=' + next.id + '" class="btn">이전글: ' + esc(next.title) + '</a>' : '')
    + '</div>';
})();
</script>
</body>
</html>
